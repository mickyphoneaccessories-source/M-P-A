<!doctype html><html lang="sw"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="logo.png"><title>M-P-A • Micky Phone Accessories</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;background:#f4f6f8;color:#17191e}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.login{min-height:100vh;background:#080808;display:flex;align-items:center;justify-content:center;padding:20px}.box{width:min(460px,100%);background:#111;color:#fff;border:1px solid #9d7800;border-radius:30px;padding:28px}.logo{width:150px;height:150px;display:block;margin:auto;object-fit:contain}.box h1{text-align:center;color:#ffd21a}.sub{text-align:center;color:#aaa}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#292929;border-radius:30px;padding:5px}.tabs button{background:none;color:#aaa;padding:13px;border-radius:25px;font-weight:700}.tabs .on{background:#ffd21a;color:#111}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:14px;border:1px solid #d7d9de;border-radius:14px}.primary{width:100%;padding:15px;background:#ffd21a;border-radius:14px;font-weight:800}.hint{text-align:center;color:#777;font-size:13px}.header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;border-radius:50%;object-fit:cover;background:#eee}.brand{flex:1}.brand h2{margin:0;font-size:19px}.brand p{margin:3px 0;color:#888}.gear{width:48px;height:48px;border-radius:14px;background:#f1f2f4}.main{max-width:920px;margin:auto;padding:16px 16px 100px}.hero{background:#d8f8dc;border-radius:28px;padding:25px;margin-bottom:16px}.hero h1{margin:0 0 10px;font-size:29px}.hero p{margin:0;font-size:18px;line-height:1.5}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.quick,.stat,.panel{background:#fff;border:1px solid #e3e5e8;border-radius:20px}.quick{padding:15px;text-align:center}.quick b{display:block;font-size:28px;margin-bottom:6px}.section{margin-top:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{padding:18px}.stat small{color:#777}.stat strong{display:block;font-size:24px;margin-top:7px}.panel{padding:18px;margin-top:14px}.search{display:flex;gap:10px}.search input{flex:1;padding:15px;border:1px solid #ddd;border-radius:18px}.product{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px dashed #ddd}.product:last-child{border:0}.product img{width:62px;height:62px;border-radius:14px;object-fit:cover;background:#111}.info{flex:1}.info h3{margin:0 0 4px}.info p{margin:0;color:#777}.price{font-weight:800;text-align:right}.fab{position:fixed;right:18px;bottom:92px;background:#2450ff;color:#fff;padding:17px 23px;border-radius:35px;font-weight:800;z-index:8}.bottom{position:fixed;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.bottom button{background:#fff;color:#8b9098}.bottom .on{color:#2450ff}.bottom span{display:block;font-size:23px}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px}.modalhead{display:flex;justify-content:space-between}.close{border-radius:50%;width:40px;height:40px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;gap:10px}.actions button{flex:1;padding:14px;border-radius:14px}.save{background:#2450ff;color:#fff}.danger{background:#fff0f1;color:#a51f2d;padding:14px;border-radius:14px}.danger button{background:#d92d3b;color:#fff;padding:11px;border-radius:10px;margin-top:8px}@media(max-width:650px){.grid4{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<div id="login" class="login"><div class="box"><img class="logo" src="logo.png" onerror="this.style.display='none'"><h1>MICKY M-P-A</h1><p class="sub">Phone Accessories & Home Decoration</p><div class="tabs"><button id="at" class="on" onclick="role='admin';at.classList.add('on');ut.classList.remove('on')">Admin</button><button id="ut" onclick="role='user';ut.classList.add('on');at.classList.remove('on')">User</button></div><div class="field"><label>Username</label><input id="un" placeholder="Andika username"></div><div class="field"><label>Password</label><input id="pw" type="password" placeholder="Password"></div><button class="primary" onclick="loginNow()">Ingia kwenye mfumo</button><p class="hint">Default: admin / 1234 • user / 1234</p></div></div>
<div id="app" class="hidden"><header class="header"><img class="avatar" src="logo.png" onerror="this.src='icon.svg'"><div class="brand"><h2>Micky Phone Accessories</h2><p>Ilembula • <span id="rt">Admin</span> • <span id="uu">admin</span></p></div><button class="gear" onclick="page='settings';render()">⚙️</button></header><main id="main" class="main"></main><nav class="bottom"><button onclick="page='home';render()" id="nh"><span>⌂</span>Home</button><button onclick="page='products';render()" id="np"><span>📦</span>Bidhaa</button><button onclick="page='sales';render()" id="ns"><span>🛒</span>Mauzo</button><button onclick="page='expenses';render()" id="ne"><span>🧾</span>Matumizi</button><button onclick="page='reports';render()" id="nr"><span>▦</span>Zaidi</button></nav><button id="fab" class="fab hidden" onclick="productForm()">＋ Bidhaa Mpya</button></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="mt">Bidhaa</h2><button class="close" onclick="modal.classList.add('hidden')">×</button></div><div id="mb"></div></div></div>
<script>
let role='admin',page='home',d=JSON.parse(localStorage.mpa||'null')||{products:[],sales:[],expenses:[]};const save=()=>localStorage.mpa=JSON.stringify(d),M=n=>'TZS '+(+n||0).toLocaleString('en-TZ'),N=v=>+String(v).replace(/[^\d.-]/g,'')||0,E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
function loginNow(){let u=un.value,p=pw.value;if((role==='admin'&&u==='admin'&&p==='1234')||(role==='user'&&u==='user'&&p==='1234')){login.classList.add('hidden');app.classList.remove('hidden');rt.textContent=role==='admin'?'Admin':'User';uu.textContent=u;render()}else alert('Username au password si sahihi.')}
function render(){['nh','np','ns','ne','nr'].forEach(x=>document.getElementById(x).classList.remove('on'));let ids={home:'nh',products:'np',sales:'ns',expenses:'ne',reports:'nr'};if(ids[page])document.getElementById(ids[page]).classList.add('on');fab.classList.toggle('hidden',!(page==='products'&&role==='admin'));let h=page==='home'?home():page==='products'?products():page==='sales'?sales():page==='expenses'?expenses():page==='reports'?reports():settings();main.innerHTML=h}
function home(){let stock=d.products.reduce((a,p)=>a+p.qty,0),s=d.sales.reduce((a,x)=>a+x.total,0),e=d.expenses.reduce((a,x)=>a+x.amount,0);return `<section class=hero><h1>Karibu M-P-A 👋</h1><p>Simamia bidhaa, stock, mauzo na matumizi yako sehemu moja. 📦📱</p></section><div class=grid4><button class=quick onclick="page='products';render()"><b>👥</b>Wateja</button><button class=quick onclick="page='products';render()"><b>📒</b>Bidhaa</button><button class=quick onclick="page='sales';render()"><b>🛒</b>Uza bidhaa</button><button class=quick onclick="page='reports';render()"><b>🔄</b>Ripoti</button><button class=quick onclick="page='expenses';render()"><b>🧾</b>Matumizi</button><button class=quick onclick="page='reports';render()"><b>📈</b>Analytics</button><button class=quick onclick="page='sales';render()"><b>🎥</b>Mauzo</button><button class=quick onclick="page='reports';render()"><b>💰</b>Madeni</button></div><div class=section><h2>Muhtasari wa leo</h2><div class=cards><div class=stat><small>Mauzo</small><strong>${M(s)}</strong></div><div class=stat><small>Faida makadirio</small><strong>${M(s-e)}</strong></div><div class=stat><small>Bidhaa</small><strong>${d.products.length}</strong></div><div class=stat><small>Units za stock</small><strong>${stock}</strong></div></div></div>`}
function products(){return `<div class=search><input id=q placeholder="🔎 Tafuta bidhaa" oninput=listProducts()><button class=gear>🗂️</button></div><div class=cards style="margin-top:14px"><div class=stat><small>Bidhaa</small><strong>${d.products.length}</strong></div><div class=stat><small>Thamani ya kuuza</small><strong>${M(d.products.reduce((a,p)=>a+p.qty*p.sell,0))}</strong></div></div><div id=plist class=panel></div>`}
function listProducts(){let q=(document.getElementById('q')?.value||'').toLowerCase(),a=d.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q));plist.innerHTML=a.length?a.map(p=>`<div class=product><img src="${E(p.image||'logo.png')}" onerror="this.src='logo.png'"><div class=info><h3>${E(p.name)}</h3><p>${p.qty} in stock • ${E(p.category)}</p></div><div class=price>${M(p.sell)}<br><button onclick="productForm(${p.id})">Hariri</button></div></div>`).join(''):'<div style="padding:35px;text-align:center;color:#888">Hakuna bidhaa.</div>'}
function productForm(id){if(role!=='admin')return alert('Admin pekee.');let p=d.products.find(x=>x.id===id)||{name:'',category:'',buy:0,sell:0,qty:1,image:''};mt.textContent=id?'Hariri Bidhaa':'Bidhaa Mpya';mb.innerHTML=`<div class=formgrid><div class="field full"><label>Picha (URL hiari)</label><input id=im value="${E(p.image)}"></div><div class="field full"><label>Jina la bidhaa</label><input id=pn value="${E(p.name)}" placeholder="Mfano Charger Fast"></div><div class=field><label>Category</label><input id=pc value="${E(p.category)}"></div><div class=field><label>Bei ya kununua</label><input id=pb inputmode=numeric value="${p.buy}"></div><div class=field><label>Bei ya kuuza</label><input id=ps inputmode=numeric value="${p.sell}"></div><div class=field><label>Idadi</label><input id=pq type=number min=0 value="${p.qty}"></div></div><div class=actions><button onclick="modal.classList.add('hidden')">Ghairi</button><button class=save onclick="saveProduct(${id||0})">Hifadhi Bidhaa</button></div>`;modal.classList.remove('hidden')}
function saveProduct(id){let p={id:id||Date.now(),image:im.value,name:pn.value.trim(),category:pc.value.trim(),buy:N(pb.value),sell:N(ps.value),qty:+pq.value||0};if(!p.name)return alert('Andika jina la bidhaa.');let i=d.products.findIndex(x=>x.id===p.id);i>=0?d.products[i]=p:d.products.push(p);save();modal.classList.add('hidden');render();if(page==='products')setTimeout(listProducts,0)}
function sales(){return `<div class=panel><h2>Uuzaji wa bidhaa</h2><div class=field><label>Bidhaa</label><select id=sp>${d.products.map(p=>`<option value=${p.id}>${E(p.name)} — ${M(p.sell)} — stock ${p.qty}</option>`).join('')}</select></div><div class=cards><div class=field><label>Idadi</label><input id=sq type=number min=1 value=1></div><div class=field><label>Discount (TZS)</label><input id=sd inputmode=numeric value=0></div></div><div class=field><label>Bei ya mwisho</label><input id=st readonly></div><button class=primary onclick=sell()>Thibitisha Mauzo</button></div><div class=panel><h3>Mauzo ya hivi karibuni</h3>${d.sales.slice(-10).reverse().map(x=>`<div class=product><div class=info><b>${E(x.name)}</b><p>${x.date} • ${x.qty}</p></div><b>${M(x.total)}</b></div>`).join('')||'<p style="color:#888">Hakuna mauzo.</p>'}</div>`}
function sell(){let p=d.products.find(x=>x.id==sp.value),q=+sq.value||0,dis=N(sd.value);if(!p||q<1)return;if(p.qty<q)return alert('Stock haitoshi.');let total=Math.max(0,p.sell*q-dis);p.qty-=q;d.sales.push({name:p.name,qty:q,total,date:new Date().toISOString().slice(0,10)});save();alert('Mauzo yamehifadhiwa.');render()}
function expenses(){return `<div class=panel><h2>Matumizi</h2><div class=field><label>Maelezo</label><input id=en placeholder="Mfano usafiri"></div><div class=field><label>Kiasi (TZS)</label><input id=ea inputmode=numeric></div><button class=primary onclick=addExp()>Hifadhi Matumizi</button></div><div class=panel>${d.expenses.slice().reverse().map(x=>`<div class=product><div class=info><b>${E(x.name)}</b><p>${x.date}</p></div><b>${M(x.amount)}</b></div>`).join('')||'<p style="color:#888">Hakuna matumizi.</p>'}</div>`}
function addExp(){if(!en.value||!N(ea.value))return alert('Jaza taarifa.');d.expenses.push({name:en.value,amount:N(ea.value),date:new Date().toISOString().slice(0,10)});save();render()}
function reports(){let s=d.sales.reduce((a,x)=>a+x.total,0),e=d.expenses.reduce((a,x)=>a+x.amount,0);return `<div class=section><h2>Analytics</h2><div class=cards><div class=stat><small>Mauzo yote</small><strong>${M(s)}</strong></div><div class=stat><small>Matumizi</small><strong>${M(e)}</strong></div><div class=stat><small>Transactions</small><strong>${d.sales.length}</strong></div><div class=stat><small>Stock units</small><strong>${d.products.reduce((a,p)=>a+p.qty,0)}</strong></div></div></div>`}
function settings(){return `<div class=section><h2>Settings</h2><div class=panel><h2>Account</h2><p>Umeingia kama ${role}.</p></div><div class=panel><h2>Data</h2><p style="color:#777">Data huhifadhiwa kwenye kifaa hiki na mfumo unaweza kufanya kazi offline.</p><div class=danger><b>Futa data zote</b><br><small>Imewekwa kwa ulinzi dhidi ya kubonyeza kwa bahati mbaya.</small><br><button onclick=wipe()>Futa data zote</button></div></div><div class=panel><button class=primary onclick=logout()>Toka</button></div>`}
function wipe(){if(role!=='admin')return alert('Admin pekee.');if(confirm('Una uhakika? Data zote za bidhaa, mauzo na matumizi zitafutwa.')){d={products:[],sales:[],expenses:[]};save();render()}}function logout(){app.classList.add('hidden');login.classList.remove('hidden');un.value='';pw.value=''}
render();
</script></body></html>
